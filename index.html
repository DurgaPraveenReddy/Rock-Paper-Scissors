<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h1>Rock Paper Scissors</h1>
    <div class = "body">
        <div class = "image">
            <img src="./images/Rock-paper-scissors-rules.png" alt="Rock-paper-scissors-rules">
        </div>
        <div class = "game-info">
            <div class = "selection">
                <div class = "input">
                    <span>Pick your choice: </span>
                    <div class = "buttons">
                        <button id = "Rock">Rock</button>
                        <button id = "Paper">Paper</button>
                        <button id = "Scissors">Scissors</button>
                    </div>
                </div>
                <div>
                    <span id = "scores"></span>
                </div>
            </div>
            <div class = "result">
                <div>
                    <span id = "roundInfo"></span>
                </div>
                <div>
                    <span id = "gameResult"></span>
                </div>
            </div>
        </div>
    </div>
    <script src = "./script.js"></script>
</body>
</html>
